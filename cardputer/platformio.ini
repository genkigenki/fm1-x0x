; SPDX-License-Identifier: GPL-3.0-only
; X0X on the original M5Stack Cardputer (StampS3, ESP32-S3FN8, 8 MB, no PSRAM), on the mvave-to-cardputer board
; layer (lib/mvave_cardputer, vendored with the kit's tools/sync_board.py). See ../CARDPUTER.md.
; Build only: install x0x-cardputer.bin into an M5Launcher slot. `pio run -t upload` would overwrite the Launcher.
; First run tools/gen.sh (X0X's generated headers in ../build/gen).

[platformio]
src_dir = src

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps = m5stack/M5Cardputer
lib_extra_dirs = lib
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DX0X_HOST=1
    -DX0X_CARDPUTER=1
    -DDLY_LEN=22050          ; the tape delay: 0.5 s (the FM-1: 2 s), for RAM
    -DX0X_UNDO=0             ; no undo (52 KB of RAM): HOME + REC says so
    -I../firmware/src
    -I../firmware/src/dsp
    -I../build/gen
    -ffp-contract=off
    -Wno-unused-function
    -Wno-unused-variable
    -Wno-unused-but-set-variable
; X0X's DSP, sequencer and engine as their own units (the list of web/emu/build.sh)
build_src_filter =
    +<*>
    +<../../firmware/src/dsp/drum909.c>
    +<../../firmware/src/dsp/drum808.c>
    +<../../firmware/src/dsp/bass303.c>
    +<../../firmware/src/dsp/breaks.c>
    +<../../firmware/src/dsp/fxbus.c>
    +<../../firmware/src/dsp/master.c>
    +<../../firmware/src/seq/sequencer.c>
    +<../../firmware/src/seq/tb3po.c>
    +<../../firmware/src/seq/pattern.c>
    +<../../firmware/src/seq/motion.c>
    +<../../firmware/src/app/engine.c>
extra_scripts = post:tools/copy_bin.py
